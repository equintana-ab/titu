<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Trade-in Banner Prototype</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <section id="trade-in-banner">
      <div class="trade-in-banner__inner">
        <div class="trade-in-banner__copy">
          <div class="copy-container">
            <img class="trade-in-banner__heading-img" src="./assets/hero-title.png" alt="Trade in to upgrade" />
            <p class="trade-in-banner__subtext">
              Upgrading made easier with
              <span class="trade-in-banner__brand"><img src="./assets/abenson-blue.png" alt="abenson" /></span>
            </p>
          </div>
          <div class="trade-in-banner__ctas">
            <a href="#" class="tib-btn tib-btn--primary">Estimate your trade-in value</a>
            <a href="#" class="tib-btn tib-btn--secondary">Find out how it works</a>
          </div>
        </div>

        <div class="trade-in-banner__media">
          <!-- single flattened asset from design: shape + photo + badges + stars all baked in -->
          <img
            class="trade-in-banner__media-img"
            src="./assets/girl.png"
            alt="Woman appraising her phone in-store, with callouts: know the value, appraise in store, upgrade with ease"
            loading="lazy" />
        </div>
      </div>
    </section>
    <!-- BRANDS SECTION -->
    <section id="brands-section">
      <div class="brands-section__inner">
        <div class="brands-section__heading">
          <h2>TRADE IN ELIGIBLE DEVICES FROM LEADING BRANDS</h2>
        </div>
        <div class="brands-section__logos">
          <img class="apple-logo" src="./assets/apple-logo.png" alt="Apple" />
          <img src="./assets/samsung-logo.png" alt="Samsung" />
          <img src="./assets/huawei-logo.png" alt="Huawei" />
          <img src="./assets/honor-logo.png" alt="Honor" />
          <img src="./assets/vivo-logo.png" alt="Vivo" />
          <img src="./assets/xiaomi-logo.png" alt="Xiaomi" />
          <img src="./assets/realme-logo.png" alt="Realme" />
          <img src="./assets/oppo-logo.png" alt="Oppo" />
        </div>
      </div>
    </section>
    <!-- CALCULATOR SECTION -->
    <section id="calculator-section">
      <div class="calculator-section__inner">
        <div class="calculator-section__heading">
          <h2>ESTIMATE YOUR TRADE-IN VALUE</h2>
          <div class="calculator-section__subtext">
            <p>Ready to upgrade? Follow these 4 easy steps to turn your old phone into value toward your new one.</p>
          </div>
        </div>
        <div class="calculator-section__form">
          <form action="#" method="post" class="trade-in-calculator-form">
            <label for="brand">Brand</label>
            <select name="brand" id="brand" required>
              <option value="">Select a brand</option>
              <option value="apple">Apple</option>
              <option value="samsung">Samsung</option>
              <option value="huawei">Huawei</option>
              <option value="honor">Honor</option>
              <option value="vivo">Vivo</option>
              <option value="xiaomi">Xiaomi</option>
              <option value="realme">Realme</option>
              <option value="oppo">Oppo</option>
            </select>

            <label for="model">Device</label>
            <select name="model" id="model" required disabled>
              <option value="">Select a model</option>
            </select>

            <label for="condition">Storage</label>
            <select name="condition" id="condition" required disabled>
              <option value="">Select condition</option>
            </select>

            <button type="submit" class="tib-btn tib-btn--primary" disabled>Estimate Value</button>
          </form>
        </div>
      </div>
    </section>
  </body>
</html>

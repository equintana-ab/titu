<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store Locator — FAQ Modal Behavior</title>
    <style>
      :root {
        --blue: #1e3fd0;
        --blue-dark: #16309e;
        --ink: #14161a;
        --muted: #6b7280;
        --line: #e7e9ee;
        --card: #ffffff;
        --bg: #f4f5f7;
        --viber: #7360f2;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        font-family: "Poppins", Helvetica, Arial, sans-serif;
      }
      .page {
        max-width: 960px;
        margin: 60px auto;
        padding: 0 20px;
        text-align: center;
      }
      #open-button {
        display: inline-flex;
        background: var(--blue);
        color: #fff;
        border: none;
        padding: 14px 28px;
        border-radius: 999px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        gap: 8px;
        align-items: center;
      }
      #open-button:hover {
        background: var(--blue-dark);
      }

      /* ============================================================
     MODAL SHELL — same mechanics as the FAQ modal:
     mobile = bottom sheet, draggable, slides up/down
     desktop (904px+) = centered, fixed size, fade in
     ============================================================ */
      #locator-modal {
        position: fixed;
        inset: 0;
        display: flex;
        visibility: hidden;
        align-items: flex-end;
        justify-content: center;
        z-index: 100000;
        opacity: 0;
        transition:
          opacity 0.3s ease-out,
          visibility 0.3s ease-out;
      }
      #locator-modal.show-modal {
        opacity: 1;
        visibility: visible;
        background: rgba(0, 0, 0, 0.5);
      }

      .modal-content-locator {
        display: flex;
        flex-direction: column;
        position: relative;
        width: 100%;
        border-radius: 16px 16px 0 0;
        background: #fff;
        transform: translateY(100%);
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.03);
        transition: transform 0.3s ease-out;
        overflow: hidden;
        max-height: 88vh;
        height: 88vh;
      }
      #locator-modal.show-modal .modal-content-locator {
        transform: translateY(0);
      }

      /* photo panel (comes first on mobile) */
      .locator-photo-panel {
        position: relative;
        height: 200px;
        flex-shrink: 0;
        background: #cfe0ff;
      }
      .locator-photo-panel img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .locator-close-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 5;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #fff;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        padding: 0;
      }
      .get-directions-btn {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 12px;
        background: var(--blue);
        color: #fff;
        border: none;
        padding: 12px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        text-align: center;
        text-decoration: none;
        display: block;
        font-family: inherit;
      }
      .get-directions-btn:hover {
        background: var(--blue-dark);
      }

      /* list panel */
      .locator-list-panel {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }
      .locator-header {
        padding: 12px 16px 10px;
        border-bottom: 1px solid var(--line);
        flex-shrink: 0;
      }
      .locator-header h2 {
        margin: 0 0 10px;
        font-size: 16px;
        color: #185baa;
        font-weight: 600;
      }
      .locator-search {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 13px;
        background: var(--bg);
        font-family: inherit;
      }
      .locator-search:focus {
        outline: 2px solid var(--blue);
        outline-offset: 1px;
      }
      .locator-status {
        font-size: 11.5px;
        color: var(--muted);
        padding: 8px 16px 0;
        flex-shrink: 0;
      }
      .locator-results {
        flex: 1;
        overflow-y: auto;
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .store-card {
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px;
        text-align: left;
        cursor: pointer;
        background: #fff;
        font-family: inherit;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }
      .store-card:hover {
        border-color: var(--blue);
      }
      .store-card.is-active {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(30, 63, 208, 0.12);
      }
      .store-card h3 {
        margin: 0 0 6px;
        font-size: 14.5px;
        color: var(--blue);
      }
      .store-card p {
        margin: 0 0 4px;
        font-size: 12.5px;
        color: var(--muted);
        line-height: 1.45;
      }
      .store-card .phones {
        font-size: 12.5px;
        color: var(--ink);
        margin: 6px 0 10px;
      }
      .viber-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--viber);
        color: var(--viber);
        background: #fff;
        font-size: 12px;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: 999px;
        cursor: pointer;
        font-family: inherit;
      }
      .viber-btn:hover {
        background: var(--viber);
        color: #fff;
      }

      /* ============================================================
     DESKTOP (904px+): centered fixed-size modal, no drag, fade in
     ============================================================ */
      @media (width >= 904px) {
        #locator-modal {
          inset: 0;
          display: none;
          align-items: center;
          background: rgba(0, 0, 0, 0.5);
          animation: modalFade 0.3s ease;
        }
        #locator-modal.show-modal {
          display: flex;
        }

        .modal-content-locator {
          flex-direction: row;
          width: 100%;
          max-width: 980px;
          height: 640px;
          max-height: 640px;
          border-radius: 20px;
          transform: none;
          box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
          animation: modalFade 0.3s ease;
        }
        #locator-modal.show-modal .modal-content-locator {
          transform: none;
        }

        .locator-list-panel {
          order: 1;
          border-right: 1px solid var(--line);
        }
        .locator-photo-panel {
          order: 2;
          height: auto;
          flex: 1;
        }
        .locator-close-btn {
          top: 16px;
          right: 16px;
          width: auto;
          height: auto;
          border-radius: 999px;
          padding: 8px 14px;
          font-size: 13px;
        }
        .get-directions-btn {
          left: 16px;
          right: 16px;
          bottom: 16px;
        }
      }

      @keyframes modalFade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>Trade-in — How it Works</h1>
      <button type="button" id="open-button">Find a nearby store</button>
    </div>

    <div id="locator-modal">
      <div class="modal-content-locator">
        <div class="locator-photo-panel">
          <button type="button" class="locator-close-btn" aria-label="Close locator">✕</button>
          <img id="storePhoto" src="" alt="Map preview of selected store" />
          <a href="#" target="_blank" rel="noopener" class="get-directions-btn" id="getDirectionsBtn">Get directions</a>
        </div>

        <div class="locator-list-panel">
          <div class="locator-header">
            <h2>Find a store near you</h2>
            <input type="text" class="locator-search" id="storeSearch" placeholder="Search your address or ZIP code" />
          </div>
          <div class="locator-status" id="storeStatus">Loading stores…</div>
          <div class="locator-results" id="storeResults"></div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        // ---------- store data (swap fetchStores() for a real endpoint) ----------
        function fetchStores() {
          return Promise.resolve([
            {
              id: 1,
              name: "Abenson Waltermart North Edsa",
              addr: "2nd Floor Waltermart North EDSA, Veterans Village, Quezon City",
              hours: "9AM to 9PM",
              phones: "(02) 8332 1045 • 0918 804 1478 • 0917 571 6609",
              viberNumber: "639178041478",
              image: "https://placehold.co/600x400/1e3fd0/ffffff?text=Waltermart+North+EDSA",
              mapsQuery: "14.6555,121.0328",
            },
            {
              id: 2,
              name: "Abenson SM North EDSA",
              addr: "Upper Ground Floor, SM North EDSA, Quezon City",
              hours: "10AM to 9PM",
              phones: "(02) 8441 2200 • 0917 555 0199",
              viberNumber: "639175550199",
              image: "https://placehold.co/600x400/163ba8/ffffff?text=SM+North+EDSA",
              mapsQuery: "14.6567,121.0303",
            },
            {
              id: 3,
              name: "Abenson TriNoma",
              addr: "3rd Floor TriNoma Mall, North Avenue, Quezon City",
              hours: "10AM to 9PM",
              phones: "(02) 8916 3344 • 0918 222 4455",
              viberNumber: "639182224455",
              image: "https://placehold.co/600x400/0f2c80/ffffff?text=TriNoma",
              mapsQuery: "14.6537,121.0322",
            },
          ]);
        }

        var allStores = [];
        var activeId = null;

        // ---------- open/close (button-triggered only, no drag) ----------
        let scrollY = 0;

        const getModal = () => document.getElementById("locator-modal");
        const getModalContent = () => document.querySelector(".modal-content-locator");

        function openModal() {
          const modal = getModal();
          if (!modal) return;

          modal.classList.add("show-modal");

          document.body.style.overflow = "hidden";
          scrollY = window.scrollY;
          document.body.style.position = "fixed";
          document.body.style.top = "-" + scrollY + "px";
          document.body.style.width = "100%";
        }

        function closeModal() {
          const modal = getModal();
          if (!modal) return;

          // classList removal alone triggers the existing CSS transition
          // (transform/opacity) back to the closed state — no JS animation needed.
          modal.classList.remove("show-modal");

          document.body.style.overflow = "";
          document.body.style.position = "";
          document.body.style.top = "";
          document.body.style.width = "";
          window.scrollTo(0, scrollY);
        }

        // ---------- store list rendering ----------
        function renderStores(list) {
          var resultsEl = document.getElementById("storeResults");
          resultsEl.innerHTML = "";
          if (!list.length) {
            resultsEl.innerHTML =
              '<p style="font-size:13px;color:var(--muted);padding:10px;">No stores match your search.</p>';
            return;
          }
          list.forEach(function (store) {
            var card = document.createElement("button");
            card.type = "button";
            card.className = "store-card" + (store.id === activeId ? " is-active" : "");
            card.dataset.id = store.id;
            card.innerHTML =
              "<h3>" +
              store.name +
              "</h3>" +
              "<p>" +
              store.addr +
              "</p>" +
              "<p>Operating Hours: " +
              store.hours +
              "</p>" +
              '<div class="phones">' +
              store.phones +
              "</div>" +
              '<span class="viber-btn" data-viber="' +
              store.viberNumber +
              '">💬 Chat on Viber</span>';
            resultsEl.appendChild(card);
          });
        }

        function selectStore(id) {
          activeId = id;
          var store = allStores.find(function (s) {
            return s.id === id;
          });
          if (!store) return;

          document.querySelectorAll(".store-card").forEach(function (c) {
            c.classList.toggle("is-active", Number(c.dataset.id) === id);
          });

          var photoEl = document.getElementById("storePhoto");
          var directionsBtn = document.getElementById("getDirectionsBtn");
          photoEl.src = store.image;
          photoEl.alt = "Map preview near " + store.name;
          directionsBtn.href =
            "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(store.mapsQuery);
        }

        // ---------- single delegated click listener (same architecture as the FAQ modal) ----------
        document.addEventListener("click", function (e) {
          const modal = getModal();

          // Open
          if (e.target.closest("#open-button")) {
            openModal();
            return;
          }

          // Close (X button)
          if (e.target.closest(".locator-close-btn")) {
            closeModal();
            return;
          }

          // Close on backdrop click
          if (e.target === modal) {
            closeModal();
            return;
          }

          // Select a store card
          var card = e.target.closest(".store-card");
          if (card) {
            selectStore(Number(card.dataset.id));
            return;
          }

          // Chat on Viber (stop it from also selecting the card)
          var viberEl = e.target.closest(".viber-btn");
          if (viberEl) {
            e.stopPropagation();
            window.location.href = "viber://chat?number=%2B" + viberEl.dataset.viber;
          }
        });

        // Prevent clicks inside the modal content from closing it via backdrop logic
        document.addEventListener("click", function (e) {
          const modal = getModal();
          if (e.target.closest(".modal-content-locator") && e.target !== modal) {
            e.stopPropagation();
          }
        });

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") closeModal();
        });

        document.getElementById("storeSearch").addEventListener("input", function () {
          var q = this.value.toLowerCase();
          var filtered = allStores.filter(function (s) {
            return s.name.toLowerCase().includes(q) || s.addr.toLowerCase().includes(q);
          });
          renderStores(filtered);
        });

        var statusEl = document.getElementById("storeStatus");
        statusEl.textContent = "Loading stores…";
        fetchStores()
          .then(function (stores) {
            allStores = stores;
            statusEl.textContent = stores.length + " stores found";
            renderStores(stores);
            if (stores.length) selectStore(stores[0].id);
          })
          .catch(function () {
            statusEl.textContent = "Could not load stores. Please try again.";
          });
      })();
    </script>
  </body>
</html>
